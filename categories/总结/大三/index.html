    (() => {
      NProgress.configure({"showSpinner":false,"trickleSpeed":180,"minimum":0.08});

      // Fast pages need no flash; background resources do not hold this open.
      const showTimer = setTimeout(() => {
        if (!finished && document.readyState === 'loading') NProgress.start();
      }, 150);
      const finish = () => {
        if (finished) return;
        finished = true;
        clearTimeout(showTimer);
        NProgress.done();
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', finish, { once: true });
      } else {
        finish();
      }
      window.addEventListener('pagehide', finish, { once: true });
      window.addEventListener('pageshow', event => {
        if (event.persisted) { finish(); NProgress.remove(); }
      });
    })();
  </script>
